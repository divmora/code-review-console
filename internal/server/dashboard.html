<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<script nonce="{{.Nonce}}">
// Apply the saved theme before the page paints. "system" follows the OS.
(function () {
  try {
    var t = localStorage.getItem("crc-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style nonce="{{.Nonce}}">
:root {
  color-scheme: light;
  --bg: #f7f7f8; --panel: #ffffff; --text: #1d1d22; --muted: #6b6b76; --line: #e4e4e9;
  --accent: #5b4fd6; --ok: #1f8a4c; --warn: #b26a00; --bad: #c4352b; --info: #2f6fd1;
  --ok-bg: #e6f4ec; --warn-bg: #fbf0dd; --bad-bg: #fbe7e5; --info-bg: #e6eefb; --idle-bg: #efeff3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1a1a1f; --text: #ececf1; --muted: #9a9aa6; --line: #2b2b33;
    --accent: #8f86ff; --ok: #4cc584; --warn: #e2a33c; --bad: #f07067; --info: #6ea2ff;
    --ok-bg: #16301f; --warn-bg: #33270f; --bad-bg: #3a1b19; --info-bg: #172742; --idle-bg: #24242b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
    --bg: #111114; --panel: #1a1a1f; --text: #ececf1; --muted: #9a9aa6; --line: #2b2b33;
    --accent: #8f86ff; --ok: #4cc584; --warn: #e2a33c; --bad: #f07067; --info: #6ea2ff;
    --ok-bg: #16301f; --warn-bg: #33270f; --bad-bg: #3a1b19; --info-bg: #172742; --idle-bg: #24242b;
}
.themepick { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.themepick select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 28px 0 10px; display: flex; gap: 8px; align-items: center; }
.sub { color: var(--muted); font-size: 13px; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.stale { background: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
td.wrap { white-space: normal; max-width: 340px; color: var(--muted); overflow-wrap: anywhere; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.s-running { background: var(--info-bg); color: var(--info); }
.s-pending { background: var(--idle-bg); color: var(--muted); }
.s-done { background: var(--ok-bg); color: var(--ok); }
.s-skipped { background: var(--warn-bg); color: var(--warn); }
.s-failed { background: var(--bad-bg); color: var(--bad); }
.count { background: var(--idle-bg); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 500; }
.empty { padding: 18px 12px; color: var(--muted); }
.plat { color: var(--muted); font-size: 12px; }
.err { color: var(--bad); }
footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="hleft">
      <h1>{{.Title}}</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>
    <label class="themepick">Theme <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <div class="sub live"><span class="dot" id="dot"></span><span id="updated">connecting</span></div>
  </header>

  <section class="tiles" id="tiles"></section>

  <h2>Running <span class="count" id="c-running">0</span></h2>
  <div class="panel" id="running"></div>

  <h2>Pending <span class="count" id="c-pending">0</span></h2>
  <div class="panel" id="pending"></div>

  <h2>Recent <span class="count" id="c-recent">0</span></h2>
  <div class="panel" id="recent"></div>

  <footer>code-review-console {{.Version}} · refreshes every 5 seconds · {{if .Persistent}}history is saved to the database and survives restarts{{else}}history is kept in memory and resets when the server restarts{{end}}</footer>
</main>
<script nonce="{{.Nonce}}">
(function () {
  var themeSel = document.getElementById("theme");
  if (!themeSel) return;
  try { themeSel.value = localStorage.getItem("crc-theme") || "system"; } catch (e) {}
  themeSel.addEventListener("change", function () {
    var v = themeSel.value;
    if (v === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    try { localStorage.setItem("crc-theme", v); } catch (e) {}
  });
})();
(function () {
  var token = "";
  try {
    var q = new URLSearchParams(location.search);
    if (q.get("token")) {
      token = q.get("token");
      try { sessionStorage.setItem("crb-token", token); } catch (e) {}
      history.replaceState(null, "", location.pathname);
    } else {
      try { token = sessionStorage.getItem("crb-token") || ""; } catch (e) {}
    }
  } catch (e) {}

  var lastOK = 0;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function ms(t) { return t ? new Date(t).getTime() : 0; }
  function dur(msv) {
    if (!msv || msv < 0) return "–";
    var s = Math.round(msv / 1000);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60); s = s % 60;
    if (m < 60) return m + "m " + s + "s";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }
  function ago(t, now) {
    var d = now - ms(t);
    if (d < 0) return "in " + dur(-d);
    return dur(d) + " ago";
  }
  function num(n) { return (n || 0).toLocaleString(); }
  function badge(state) { return el("span", { cls: "badge s-" + state, text: state }); }
  function pr(r) {
    var label = r.number ? r.repo + " #" + r.number : r.repo;
    var a = r.url ? el("a", { href: r.url, target: "_blank", rel: "noopener noreferrer", text: label }) : el("span", { text: label });
    return el("td", null, [a, " ", el("span", { cls: "plat", text: r.platform })]);
  }
  function table(cols, rows, emptyText) {
    if (!rows.length) return el("div", { cls: "empty", text: emptyText });
    var head = el("tr", null, cols.map(function (c) { return el("th", { text: c }); }));
    return el("table", null, [el("thead", null, [head]), el("tbody", null, rows)]);
  }
  function tile(n, l) { return el("div", { cls: "tile" }, [el("div", { cls: "n", text: n }), el("div", { cls: "l", text: l })]); }
  function set(id, node) { var p = document.getElementById(id); p.replaceChildren(node); }

  function render(d) {
    var now = ms(d.now);
    document.getElementById("meta").textContent =
      d.workers + " workers · debounce " + d.debounce + " · up " + dur(now - ms(d.since)) +
      (d.redacted ? " · repository names hidden" : "") + " · mention @" + d.bot_name;
    var t = d.totals;
    document.getElementById("tiles").replaceChildren(
      tile(num(d.running.length), "running"),
      tile(num(d.pending.length), "pending"),
      tile(num(t.done), "completed"),
      tile(num(t.failed), "failed"),
      tile(num(t.comments), "comments posted"),
      tile(dur(t.avg_duration_ms), "avg review time")
    );
    document.getElementById("c-running").textContent = d.running.length;
    document.getElementById("c-pending").textContent = d.pending.length;
    document.getElementById("c-recent").textContent = d.recent.length;

    set("running", table(["Pull request", "Job", "Trigger", "Started", "Elapsed"],
      d.running.map(function (r) {
        return el("tr", null, [pr(r), el("td", { text: r.kind }), el("td", { text: r.trigger }),
          el("td", { text: ago(r.started, now) }), el("td", { cls: "num", text: dur(now - ms(r.started)) })]);
      }), "Nothing is running."));

    set("pending", table(["Pull request", "Job", "Trigger", "Queued", "Starts", "Merged pushes"],
      d.pending.map(function (r) {
        var starts = ms(r.ready_at) > now ? ago(r.ready_at, now) : "next free worker";
        return el("tr", null, [pr(r), el("td", { text: r.kind }), el("td", { text: r.trigger }),
          el("td", { text: ago(r.enqueued, now) }), el("td", { text: starts }), el("td", { cls: "num", text: r.merged })]);
      }), "The queue is empty."));

    set("recent", table(["Pull request", "Job", "Status", "Finished", "Took", "Files", "Comments", "Tokens in/out", "Notes"],
      d.recent.map(function (r) {
        var note = r.note || "";
        if (r.error) {
          var short = r.error.length > 140 ? r.error.slice(0, 140) + "…" : r.error;
          note = el("span", { cls: "err", text: short, title: r.error });
        }
        return el("tr", null, [pr(r), el("td", { text: r.kind }), el("td", null, [badge(r.state)]),
          el("td", { text: ago(r.finished, now) }), el("td", { cls: "num", text: r.started ? dur(ms(r.finished) - ms(r.started)) : "–" }),
          el("td", { cls: "num", text: r.files || "–" }), el("td", { cls: "num", text: r.comments || "–" }),
          el("td", { cls: "num", text: r.tokens_in ? num(r.tokens_in) + " / " + num(r.tokens_out) : "–" }),
          el("td", { cls: "wrap" }, [note])]);
      }), "No finished jobs yet."));
  }

  function tick() {
    var headers = token ? { Authorization: "Bearer " + token } : {};
    fetch("/api/status", { headers: headers, cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) throw new Error("token required: open /dashboard?token=…");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) { lastOK = Date.now(); render(d); status(); })
      .catch(function (e) { status(e.message); });
  }
  function status(err) {
    var dot = document.getElementById("dot"), u = document.getElementById("updated");
    var stale = err || (Date.now() - lastOK > 15000);
    dot.className = "dot" + (stale ? " stale" : "");
    u.textContent = err ? err : (lastOK ? "updated " + dur(Date.now() - lastOK) + " ago" : "connecting");
  }
  tick();
  setInterval(tick, 5000);
  setInterval(function () { status(); }, 1000);
})();
</script>
</body>
</html>
