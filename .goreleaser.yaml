version: 2

project_name: code-review-console

before:
  hooks:
    - go mod tidy
    - go mod verify
    # The admin UI isn't committed: build it so the binaries embed it.
    - make web

builds:
  - id: console
    main: ./cmd/console
    binary: code-review-console
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    # No Windows build: the local executor uses Unix process groups
    # (Setpgid, kill of the group). Run the console on Linux or macOS, or
    # in Docker.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/divmora/code-review-console/internal/version.Version={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '(?i)^docs:'
      - '(?i)^test:'
      - '(?i)^chore:'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: '✨ Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: '⚡ Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: '🔒 Security Updates'
      regexp: "^.*sec[(\\w)]*:+.*$"
      order: 3
    - title: '♻️ Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 4
    - title: '📚 Documentation'
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 5
    - title: '🧪 Testing & QA'
      regexp: "^.*test[(\\w)]*:+.*$"
      order: 6
    - title: '🔧 Tooling & CI'
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 7
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: divmora
    name: code-review-console
  draft: false
  prerelease: auto
  mode: replace
