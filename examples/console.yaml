# console.yaml: Divmora Code Review Console (optional).
# ${VAR} is replaced with the environment variable VAR when the file loads.
#
# The file is optional: every key below can be an environment variable
# instead (see examples/console.env, or `code-review-console env`), and an
# environment variable wins over the file.
#
# It holds only what the console needs to start and the limits a
# panel admin must not change. Everything else is managed in the admin
# panel and stored in the database:
#   Code hosts   GitHub, GitLab and Bitbucket hosts and their webhooks
#   Models       model profiles, the default model and fallbacks
#   Settings     allowlist, reviewer rule, branch syncs, labels, status, retention, status page,
#                reviews at once, queue size, timeouts, review engine, bot name, extra env vars,
#                dashboard token
#   Executor     bot version, CPU, memory, disk, scheduling, pod metadata, CA bundle
#   License      the Divmora license key
#
# Required environment variables:
#   DATABASE_URL                     PostgreSQL (or database.url below)
#   CODEREVIEW_CONSOLE_SECRET_KEY    encrypts code host tokens: openssl rand -base64 32
# Model API keys are environment variables too; a profile names its variable (api_key_env).

# ---- Where reviews run ----
# The executor type and what reviews can reach stay here. The bot version,
# resources, scheduling and pod metadata are on the admin panel's Executor
# page. The image tag below is the version used until one is saved there.
# Each review runs the codereview CLI once. Credentials are minted per job
# (GitHub App installation tokens) and passed as environment variables.
executor:
  type: local                          # local | docker | kubernetes
  local:
    binary: codereview                 # bundled in the console image
  docker:
    image: ghcr.io/divmora/code-review-bot:0.8.0
    # network: bridge
  kubernetes:
    image: ghcr.io/divmora/code-review-bot:0.8.0
    namespace: code-review
    service_account: ""                # set for IRSA / EKS Pod Identity / workload identity (e.g. Bedrock)
    automount_service_account_token: false  # true only if review pods need the Kubernetes API token
    # kubeconfig: /path/to/kubeconfig  # empty = in-cluster

# ---- Server ----
server:
  addr: ":8080"

# ---- Database and admin sign-in ----
database:
  url: ${DATABASE_URL}

admin:
  enabled: true
  base_url: https://review.example.com
  session_ttl: 12h
  oidc:
    issuer: https://accounts.google.com
    client_id: ${OIDC_CLIENT_ID}
    client_secret: ${OIDC_CLIENT_SECRET}
    allowed_domains: [example.com]
