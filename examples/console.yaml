# console.yaml: Divmora Code Review Console.
# ${VAR} is replaced with the environment variable VAR when the file loads.

# ---- Review engine (same keys as the codereview CLI config) ----
# Model profiles can also be managed in the admin panel (Models), which
# wins over these for the same name and can take over the default. Never
# put keys here or in the panel: reference them by env var name.
model: claude
fallback: [backup]
models:
  claude: { provider: bedrock, model: <bedrock-model-or-inference-profile-id>, region: us-east-1 }
  backup: { provider: openai, model: <openai-model>, api_key_env: OPENAI_API_KEY }
review:
  defaults: { profile: balanced, max_comments: 25 }

# Mention handle for chat commands (@<bot_name> review / full review / help / <question>).
# Default: each host's token user (e.g. @gitlab-bot), so mentions reach the real account.
# Set it for a GitHub App (its slug), or per host under github:/gitlab:.
# bot_name: codereview

# ---- Code hosts (deprecated here) ----
# Hosts are managed in the admin panel (Code hosts). These sections only seed the database on
# first start and will be removed in a future release. To keep hosts in Git, use
# `console hosts export` / `console hosts import` (see docs/deploy.md, "Moving code hosts").
github:
  app_id: 123456
  private_key_file: /secrets/github-app.pem
  webhook_secret: ${GITHUB_WEBHOOK_SECRET}
  # token: ${GITHUB_TOKEN}             # instead of an App, for simple setups
  # api_url: https://ghe.example.com/api/v3

gitlab:
  - base_url: https://gitlab.com
    token: ${GITLAB_TOKEN}
    # Webhook authentication. GitLab 19.0+ signs webhooks with a signing token
    # (webhook-signature, HMAC-SHA256): recommended. The older secret token is
    # sent in plain text. With both set, signed requests are checked by their
    # signature and unsigned ones fall back to the secret token.
    signing_token: ${GITLAB_WEBHOOK_SIGNING_TOKEN}   # whsec_...
    webhook_secret: ${GITLAB_WEBHOOK_SECRET}
    # require_signature: true          # once every webhook has a signing token
    # Several hooks on one instance (a system hook plus group or project
    # hooks), each with its own token: list the extra ones. The same event
    # arriving through two hooks is processed once.
    # signing_tokens: [${GITLAB_GROUP_HOOK_SIGNING_TOKEN}]
    # webhook_secrets: [${GITLAB_PROJECT_HOOK_SECRET}]
    # Per-instance identity (defaults: top-level bot_name, the token's user):
    # bot_name: acme-review            # @acme-review review
    # reviewer: acme-review-bot        # username that counts for require_reviewer
  # - base_url: https://gitlab.other.example   # more instances: own token, hooks and bot

# Bitbucket Cloud: an access token, or an account email + Atlassian API token.
# bitbucket:
#   - token: ${BITBUCKET_TOKEN}
#     webhook_secret: ${BITBUCKET_WEBHOOK_SECRET}
#     reviewer: acme-review-bot          # access tokens have no user: name the bot account

# Hosts above are the initial configuration: with CODEREVIEW_CONSOLE_SECRET_KEY set
# (openssl rand -base64 32), they are copied into the database, encrypted, on first
# start and managed under "Code hosts" in the admin panel from then on.

# ---- Where reviews run ----
# Each review runs the codereview CLI once. Credentials are minted per job
# (GitHub App installation tokens) and passed as environment variables.
executor:
  type: local                          # local | docker | kubernetes
  local:
    binary: codereview                 # bundled in the console image
  docker:
    image: ghcr.io/divmora/code-review-bot:0.4.0
    cpus: "1"
    memory: 1g
    # network: bridge
  kubernetes:
    image: ghcr.io/divmora/code-review-bot:0.4.0
    namespace: code-review
    service_account: ""                # set for IRSA / EKS Pod Identity / workload identity (e.g. Bedrock)
    automount_service_account_token: false  # true only if review pods need the Kubernetes API token
    cpu: "1"
    memory: 1Gi
    ttl: 10m                           # keep finished Jobs for debugging
    # kubeconfig: /path/to/kubeconfig  # empty = in-cluster
    # Where review pods run (see docs/deploy.md). tolerations and affinity use Kubernetes field names.
    # node_selector: { workload: batch }
    # tolerations:
    #   - { key: dedicated, operator: Equal, value: batch, effect: NoSchedule }
    # affinity: {}                     # a corev1 Affinity, e.g. nodeAffinity: {...}
    # priority_class_name: ""
    # pod_labels: {}                   # merged with the built-in labels
    # pod_annotations: { karpenter.sh/do-not-disrupt: "true" }
    # Extra CA certificates (PEM) to trust, e.g. a private GitLab or a TLS-inspecting proxy.
    # ca_bundle: { config_map: corporate-ca, key: ca.crt }   # or secret: <name>
  # Extra env var names to forward to every review (provider keys are forwarded by default).
  env: []

# ---- Server and queue ----
server:
  addr: ":8080"
  workers: 4                           # reviews running at once
  queue_size: 100
  job_timeout: 20m
  debounce: 30s
  dashboard:
    enabled: false                     # token-protected /dashboard; the public page is managed in the UI
    token: ${DASHBOARD_TOKEN}
    history: 200

# ---- Database, allowlist, admin sign-in ----
database:
  url: ${DATABASE_URL}
repos:
  allowlist: true                      # review only repositories enabled directly or by a group/pattern rule
  require_reviewer: false              # true: review an MR/PR only when the bot user is one of its reviewers
# The Divmora license key is managed in the admin panel under License (without one the console runs
# the free core). license.file is deprecated: its key is copied into the database once.
# CODEREVIEW_CONSOLE_LICENSE overrides the panel, for example when nobody can sign in.
# license:
#   file: /etc/console/license.key

admin:
  enabled: true
  base_url: https://review.example.com
  session_ttl: 12h
  oidc:
    issuer: https://accounts.google.com
    client_id: ${OIDC_CLIENT_ID}
    client_secret: ${OIDC_CLIENT_SECRET}
    allowed_domains: [example.com]
