name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The admin UI isn't committed; the binary and the admin tests embed it,
  # so it's built (and type-checked) before lint and tests.
  ci:
    uses: divmora/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.27'
      node-version: '24'
      node-cache-dependency-path: web/package-lock.json
      pre-build-command: make web
