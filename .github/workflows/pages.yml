name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: divmora/.github/.github/workflows/pages-deploy.yml@main
    with:
      artifact-path: './site'
