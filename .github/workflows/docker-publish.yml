name: CI/CD

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA'
        required: false
        type: string
      tag_name:
        description: 'Tag Name'
        required: false
        type: string

jobs:
  ci-cd:
    uses: divmora/.github/.github/workflows/docker-publish.yml@main
    with:
      enable-go-quality: true
      # The admin UI isn't committed: build it before lint and tests.
      node-version: '24'
      node-cache-dependency-path: web/package-lock.json
      pre-build-command: make web
      go-version: '1.27'
      sha: ${{ inputs.sha || '' }}
      tag_name: ${{ inputs.tag_name || '' }}
    secrets: inherit
