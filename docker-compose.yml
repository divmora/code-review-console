# Divmora Code Review Console with PostgreSQL.
#   cp examples/console.yaml console.yaml   # edit models, github/gitlab, admin
#   docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: console
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console"]
      interval: 5s
      retries: 20

  console:
    build: .
    command: ["serve", "--config", "/etc/console/console.yaml"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://console:${POSTGRES_PASSWORD:-change-me}@db:5432/console?sslmode=disable
    env_file:
      - path: .env           # provider keys, GITHUB_WEBHOOK_SECRET, OIDC_CLIENT_SECRET, ...
        required: false
    volumes:
      - ./console.yaml:/etc/console/console.yaml:ro
      # For executor.type: docker, also mount the Docker socket:
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

volumes:
  pgdata:
