# Divmora Code Review Console with PostgreSQL, configured with environment
# variables (no config file needed).
#   cp examples/console.env .env    # set the secret key and admin sign-in
#   docker compose up --build
# Then sign in and follow Setup: code hosts, models and the license are
# added in the admin panel.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: console
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console"]
      interval: 5s
      retries: 20

  console:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://console:${POSTGRES_PASSWORD:-change-me}@db:5432/console?sslmode=disable
    env_file:
      - path: .env           # CODEREVIEW_CONSOLE_*, model keys
        required: false
    # A config file is optional; to use one as well as .env, add the command
    # and the first volume. For CODEREVIEW_CONSOLE_EXECUTOR=docker, mount
    # the Docker socket.
    # command: ["serve", "--config", "/etc/console/console.yaml"]
    # volumes:
    #   - ./console.yaml:/etc/console/console.yaml:ro
    #   - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

volumes:
  pgdata:
